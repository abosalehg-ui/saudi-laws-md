name: tests

on:
  push:
    branches: [main]
  pull_request:

# أقلّ صلاحية ممكنة: هذه الـ workflows تقرأ الكود ولا تكتب شيئًا.
# بلا هذه الكتلة تُورَث الصلاحية الافتراضية للمستودع، وقد تكون أوسع.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # يطابق requires-python >=3.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check scripts tests

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # فحص صحة المُدوَّنة المُلتزمة: يُفشل عند الأخطاء الصلبة (عناوين معطوبة،
      # ضجيج واجهة، فقرات مكرّرة، حقول ناقصة)؛ التحذيرات تُعرض ولا تُفشل
      - run: python -m scripts.lint_corpus laws --warnings
      # التأكد أن index.json وفهارس المجلدات وعدّاد README محدَّثة مع أي تغيير
      - run: python -m scripts.build_index laws --check
