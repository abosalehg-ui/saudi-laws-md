name: update-corpus

# تحديث دوري للمُدوَّنة من المصدرين عبر الجلب الشرطي (ETag/Last-Modified)،
# ثم فتح Pull Request مسودة بالتغييرات للمراجعة اليدوية قبل الدمج.
#
# التشغيل أسبوعي على ربع الروابط في كل مرة (--shard) بدل شهري على كلها:
# نفس دورية زيارة كل وثيقة (شهر)، لكن التشغيلة الواحدة تنتهي في ربع الزمن
# فلا تصطدم بسقف GitHub الصلب (360 دقيقة) مع نمو المُدوَّنة. التقسيم حتمي
# بتجزئة الرابط، فالشرائح الأربع تغطي كل الروابط بلا ثغرة ولا تكرار.
on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC كل اثنين
  workflow_dispatch:       # وتشغيل يدوي عند الحاجة
    inputs:
      shard:
        description: "الشريحة I/N (فارغ = كل الروابط)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # الشريحة الواحدة تنتهي في نحو ربع زمن التشغيلة الكاملة
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: تحديد شريحة هذا الأسبوع
        id: shard
        run: |
          if [ -n "${{ github.event.inputs.shard }}" ]; then
            echo "value=${{ github.event.inputs.shard }}" >> "$GITHUB_OUTPUT"
          else
            # رقم الأسبوع ISO مقسومًا على 4: كل وثيقة تُزار مرة كل شهر
            echo "value=$(( $(date -u +%-V) % 4 ))/4" >> "$GITHUB_OUTPUT"
          fi

      - name: جلب شرطي من المصدرين
        # لا ‎|| true‎ هنا: كان يبتلع الفشل الكلي (سقوط الموقعين أو تغيّر
        # بنيتهما) فتنتهي التشغيلة «بنجاح» بلا PR وبلا إشارة. الآن يُتسامح
        # مع فشل روابط مفردة، ويُفشَل عند تجاوز نسبة الفشل العتبة.
        run: |
          set +e
          python -m scripts.main --discover qanoonsa,nezams \
            --check-updates --resume --delay 2 --report \
            --quiet-warnings --shard "${{ steps.shard.outputs.value }}"
          set -e
          python -m scripts.check_run_health logs/summary.md --max-failure-rate 0.2

      - name: صيانة (تطبيع الروابط، هجرة الحقول، إعادة تصنيف، تدقيق الازدواج، بناء الفهرس)
        run: |
          python -m scripts.canonicalize_urls laws
          python -m scripts.migrate_corpus laws
          python -m scripts.reclassify laws
          python -m scripts.audit_duplicates laws
          python -m scripts.build_index laws

      - name: فحص صحة المُدوَّنة
        # لا يُفشل التشغيلة (المخرجات ستُراجَع في PR على أي حال)، لكن نتيجته
        # تظهر في السجل ليعرف المراجع ما إذا أدخلت الدفعة أخطاءً صلبة
        run: python -m scripts.lint_corpus laws --warnings || true

      - name: رفع تقرير التشغيلة كأثر (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: summary
          path: logs/summary.md
          if-no-files-found: ignore

      - name: فتح PR بالتغييرات إن وُجدت
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain laws index.json README.md)" ]; then
            echo "لا تغييرات في laws/ — لا PR."
            exit 0
          fi
          branch="auto/update-corpus-$(date -u +%Y%m%d)"
          git fetch origin "$branch" 2>/dev/null && git branch -D "$branch" 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add laws index.json README.md
          git commit -m "تحديث دوري للمُدوَّنة من المصدرين (جلب شرطي)"
          git push -u origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "تحديث دوري للمُدوَّنة $(date -u +%Y-%m-%d)" \
            --body "تشغيل آلي (\`--check-updates\`) على الشريحة ${{ steps.shard.outputs.value }} من qanoonsa وnezams. راجِع الفروق يدويًا قبل الدمج؛ تقرير التشغيلة مرفوع كأثر (artifact) باسم summary."
