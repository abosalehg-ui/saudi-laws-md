name: smoke

# فحص دخاني أسبوعي ضد المواقع الحيّة: يكشف تغيّر بنية HTML للموقعين مبكرًا
# (عطل استخراج صامت لا تلتقطه اختبارات الـ fixtures الثابتة). يحتاج شبكة،
# لذا هو منفصل عن CI العادي ولا يعمل على كل push/PR.
on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC كل اثنين
  workflow_dispatch:

# أقلّ صلاحية ممكنة: هذه الـ workflows تقرأ الكود ولا تكتب شيئًا.
# بلا هذه الكتلة تُورَث الصلاحية الافتراضية للمستودع، وقد تكون أوسع.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: فحص استخراج عيّنة من كل مصدر
        run: python -m scripts.smoke
